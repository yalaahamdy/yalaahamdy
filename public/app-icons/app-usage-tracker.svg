<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <!-- Background Gradient: Midnight Navy / Indigo -->
    <linearGradient id="muraqib-bg" x1="18" y1="12" x2="90" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141E33" />
      <stop offset="0.5" stop-color="#0F172A" />
      <stop offset="1" stop-color="#0A0F1D" />
    </linearGradient>

    <!-- Usage Time Ring Gradient -->
    <linearGradient id="ring-grad" x1="28" y1="28" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#818CF8" />
    </linearGradient>

    <!-- Central Shield Gradient -->
    <linearGradient id="shield-grad" x1="40" y1="37" x2="68" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="108" height="108" rx="24" fill="url(#muraqib-bg)" />

  <!-- Subtle glow circle -->
  <circle cx="54" cy="54" r="38" fill="#38BDF8" fill-opacity="0.08" />

  <!-- Usage Time Ring -->
  <path d="M54,28 A26,26 0 1,1 32,40" stroke="url(#ring-grad)" stroke-width="3.2" stroke-linecap="round" fill="none" />

  <!-- Accent Indicator Dot -->
  <circle cx="32" cy="40" r="2.2" fill="#F59E0B" />

  <!-- Central Shield -->
  <path d="M54,37 C61,37 68,39 68,48 C68,58.5 59.5,67 54,70 C48.5,67 40,58.5 40,48 C40,39 47,37 54,37 Z" fill="url(#shield-grad)" />

  <!-- Shield Border -->
  <path d="M54,37 C61,37 68,39 68,48 C68,58.5 59.5,67 54,70 C48.5,67 40,58.5 40,48 C40,39 47,37 54,37 Z" stroke="#93C5FD" stroke-width="1.2" fill="none" />

  <!-- Analytics / Monitoring Bars -->
  <path d="M48,58 L48,52" stroke="#BAE6FD" stroke-width="2.4" stroke-linecap="round" />
  <path d="M54,58 L54,46" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />
  <path d="M60,58 L60,49" stroke="#BAE6FD" stroke-width="2.4" stroke-linecap="round" />
</svg>